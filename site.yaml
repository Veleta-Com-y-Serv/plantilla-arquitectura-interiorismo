  preguntas:
    activa: true
    antetitulo: Preguntas
    titulo: Antes de empezar
    texto: "Si tu duda no está aquí, llámanos o escríbenos: respondemos en el día."
    preguntas:
      - { pregunta: "¿Cuánto cuesta un proyecto?", respuesta: "Depende del tamaño y del tipo de encargo. Tras la primera visita te enviamos una propuesta de honorarios cerrada y dividida por fases." }
      - { pregunta: "¿La primera visita tiene coste?", respuesta: "No. Vemos el espacio contigo, hablamos de lo que necesitas y te decimos con sinceridad si podemos ayudarte." }
      - { pregunta: "¿Os encargáis de la licencia de obras?", respuesta: "Sí. Redactamos el proyecto, lo presentamos en el ayuntamiento y te avisamos de cada paso hasta tener la licencia." }
      - { pregunta: "¿Trabajáis con una constructora concreta?", respuesta: "Pedimos ofertas a tres constructoras de confianza y te ayudamos a comparar. Tú decides con cuál seguir." }
      - { pregunta: "¿Trabajáis fuera de Bilbao?", respuesta: "Sí, en toda Bizkaia y en Cantabria y Álava cercanas. Muchas de nuestras rehabilitaciones son caseríos." }

