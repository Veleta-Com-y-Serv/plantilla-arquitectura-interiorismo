      - { titulo: Anteproyecto, texto: "Planos, primeras vistas en 3D y un presupuesto orientativo para decidir.", duracion: "3-4 semanas" }
      - { titulo: Proyecto y licencia, texto: "Definimos cada detalle, pedimos ofertas a constructoras y tramitamos la licencia.", duracion: "1-2 meses" }
