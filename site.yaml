  sobre-nosotros:
    activa: true
    antetitulo: El estudio
    titulo: Un estudio pequeño a propósito.
    texto: |
      Arraiz Estudio abre en 2014 en el Ensanche de Bilbao. Somos cuatro personas y cada encargo lo llevan las mismas de principio a fin: quien dibuja el primer boceto es quien visita la obra.

      Trabajamos con carpinteros, canteros y constructoras de Bizkaia que conocemos bien. Preferimos pocos materiales, nobles y del lugar: madera, piedra, cal y mucha luz.
    imagen: /fotos/estudio.jpg
    personas:
      - { nombre: Nerea Arraiz, cargo: Arquitecta · Fundadora, foto: /placeholders/persona.svg, texto: "Dirige los proyectos y las obras de rehabilitación." }
      - { nombre: Jon Etxebarria, cargo: Arquitecto técnico, foto: /placeholders/persona.svg, texto: "Presupuestos, licencias y seguimiento de obra." }
      - { nombre: Ainhoa Uribe, cargo: Interiorista, foto: /placeholders/persona.svg, texto: "Materiales, iluminación y mobiliario a medida." }
      - { nombre: Iker Sarasola, cargo: Delineante · Imagen 3D, foto: /placeholders/persona.svg, texto: "Planos, maquetas y vistas para decidir antes de obrar." }

